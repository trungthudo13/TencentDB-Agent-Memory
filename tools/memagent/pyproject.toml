[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memagent"
version = "0.1.0"
description = "Configure Codex and Claude Code for MemoryProxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomlkit>=0.13,<1"]

[project.scripts]
memagent = "memagent.cli:main"

[tool.setuptools.packages.find]
include = ["memagent*"]
