# Initial local deployment: preserve the caller's upstream credentials.
# This is an API reverse proxy, not an HTTP CONNECT forward proxy.
server:
  host: 0.0.0.0
  port: 8096
  forwardTimeoutMs: 600000

upstream:
  # Compose can override the URL with PROXY_UPSTREAM_URL via --upstream.
  url: https://chatgpt.com/backend-api/codex
  apiKey: ""

log:
  level: info
  backend: console
  file: ""

storage:
  enabled: true
  backend: sqlite
  sqlite:
    dbPath: /data/tdai-memory-proxy/proxy.db

redis:
  enabled: false
rateLimit:
  tpm: 0
  qpm: 0
costGuard:
  enabled: false
creditReport:
  url: ""

# ChatGPT credentials are NOT MemoryCore user keys. Enable these features only
# after separate MemoryCore identity/authentication has been integrated.
auth:
  enabled: false
sessionInit:
  enabled: false
injection:
  enabled: false
  assetReflection:
    markerOptIn: false
extraction:
  enabled: false
tdai:
  enabled: false
  endpoint: http://memory:8420
skill:
  endpoint: http://memory:8420
  serviceToken: ""
knowledge:
  enabled: false

opik:
  enabled: false
langfuse:
  enabled: false
clickhouse:
  enabled: false
traceArchive:
  enabled: false
